name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:

          - service: accounting
            dockerfile: ./src/accounting/Dockerfile
            context: .
            build_args: --build-arg TARGETARCH=amd64

          - service: ad
            dockerfile: ./src/ad/Dockerfile
            context: ./src/ad

          - service: cart
            dockerfile: ./src/cart/src/Dockerfile
            context: .

          - service: checkout
            dockerfile: ./src/checkout/Dockerfile
            context: .

          - service: currency
            dockerfile: ./src/currency/Dockerfile
            context: .
            build_args: --build-arg OPENTELEMETRY_CPP_VERSION=1.14.2

          - service: email
            dockerfile: ./src/email/Dockerfile
            context: .

          - service: flagd-ui
            dockerfile: ./src/flagd-ui/Dockerfile
            context: .

          - service: fraud-detection
            dockerfile: ./src/fraud-detection/Dockerfile
            context: .
            build_args: --build-arg OTEL_JAVA_AGENT_VERSION=2.9.0

          - service: frontend
            dockerfile: ./src/frontend/Dockerfile
            context: .

          - service: frontend-proxy
            dockerfile: ./src/frontend-proxy/Dockerfile
            context: .

          - service: image-provider
            dockerfile: ./src/image-provider/Dockerfile
            context: .

          - service: kafka
            dockerfile: ./src/kafka/Dockerfile
            context: .
            build_args: --build-arg OTEL_JAVA_AGENT_VERSION=2.9.0

          - service: load-generator
            dockerfile: ./src/load-generator/Dockerfile
            context: .

          - service: opensearch
            dockerfile: ./src/opensearch/Dockerfile
            context: .

          - service: payment
            dockerfile: ./src/payment/Dockerfile
            context: .

          - service: postgres
            dockerfile: ./src/postgres/Dockerfile
            context: .

          - service: product-catalog
            dockerfile: ./src/product-catalog/Dockerfile
            context: ./src/product-catalog

          - service: quote
            dockerfile: ./src/quote/Dockerfile
            context: .

          - service: recommendation
            dockerfile: ./src/recommendation/Dockerfile
            context: ./src/recommendation

          - service: shipping
            dockerfile: ./src/shipping/Dockerfile
            context: .

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          IMAGE=${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ matrix.service }}:${{ github.run_number }}

          docker build \
            -t $IMAGE \
            -f ${{ matrix.dockerfile }} \
            ${{ matrix.build_args }} \
            ${{ matrix.context }}

      - name: Push Docker image
        run: |
          IMAGE=${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ matrix.service }}:${{ github.run_number }}
          docker push $IMAGE