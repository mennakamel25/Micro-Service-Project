# ══════════════════════════════════════════════════════════════════════════════
# Network Policies - otel-demo
# المبدأ: deny-all افتراضي، وبعدين نفتح اللي محتاجه بس
# ══════════════════════════════════════════════════════════════════════════════

# ─── Default Deny All ─────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: {{ .Values.namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# ─── Allow DNS (required for all pods) ───────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: {{ .Values.namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# ─── valkey: only cart can talk to it ────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: valkey-policy
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: valkey
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cart
      ports:
        - port: 6379
---
# ─── kafka: accounting, checkout, fraud-detection can talk to it ──────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-policy
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kafka
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: accounting
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: checkout
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: fraud-detection
      ports:
        - port: 9092
        - port: 9093
---
# ─── flagd: all services can talk to it ───────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flagd-policy
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: flagd
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: otel-demo
      ports:
        - port: 8013
        - port: 4000
---
# ─── frontend-proxy: internet ingress ─────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-proxy-policy
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: frontend-proxy
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: frontend
      ports:
        - port: 8080
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: image-provider
      ports:
        - port: 8081
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: flagd
      ports:
        - port: 8013
        - port: 4000
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: load-generator
      ports:
        - port: 8089
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# ─── frontend: can talk to backend services ───────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-policy
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: frontend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: frontend-proxy
      ports:
        - port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ad
      ports:
        - port: 9099
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cart
      ports:
        - port: 8080
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: checkout
      ports:
        - port: 8080
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: currency
      ports:
        - port: 8080
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: product-catalog
      ports:
        - port: 8080
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: recommendation
      ports:
        - port: 8080
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: shipping
      ports:
        - port: 8080
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: flagd
      ports:
        - port: 8013
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
