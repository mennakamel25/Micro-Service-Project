# ─── flagd ────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flagd
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: flagd
    {{- include "otel-demo.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flagd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flagd
        app.kubernetes.io/component: flagd
    spec:
      serviceAccountName: otel-demo
      initContainers:
        - name: init-config
          image: busybox
          command: ["sh", "-c", "cp /config-ro/demo.flagd.json /config-rw/demo.flagd.json"]
          volumeMounts:
            - mountPath: /config-ro
              name: config-ro
            - mountPath: /config-rw
              name: config-rw
      containers:
        - name: flagd
          image: ghcr.io/open-feature/flagd:v0.11.1
          imagePullPolicy: IfNotPresent
          command:
            - /flagd-build
            - start
            - --uri
            - file:./etc/flagd/demo.flagd.json
          ports:
            - containerPort: 8013
              name: service
          env:
            - name: OTEL_SERVICE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app.kubernetes.io/component']
            - name: OTEL_COLLECTOR_NAME
              value: {{ .Values.otelCollectorName }}
            - name: FLAGD_METRICS_EXPORTER
              value: otel
            - name: FLAGD_OTEL_COLLECTOR_URI
              value: "$(OTEL_COLLECTOR_NAME):4317"
          resources:
            limits:
              memory: 75Mi
          volumeMounts:
            - name: config-rw
              mountPath: /etc/flagd
        - name: flagd-ui
          image: {{ .Values.registry }}/flagd-ui:{{ .Values.imageTag }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: 4000
              name: ui
          env:
            - name: OTEL_SERVICE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app.kubernetes.io/component']
            - name: OTEL_COLLECTOR_NAME
              value: {{ .Values.otelCollectorName }}
            - name: FLAGD_METRICS_EXPORTER
              value: otel
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://$(OTEL_COLLECTOR_NAME):4318"
          resources:
            limits:
              memory: 75Mi
          volumeMounts:
            - mountPath: /app/data
              name: config-rw
      volumes:
        - name: config-rw
          emptyDir: {}
        - name: config-ro
          configMap:
            name: flagd-config
---
