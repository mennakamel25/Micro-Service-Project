# ─── accounting ───────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: accounting
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: accounting
    {{- include "otel-demo.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: accounting
  template:
    metadata:
      labels:
        app.kubernetes.io/name: accounting
        app.kubernetes.io/component: accounting
    spec:
      serviceAccountName: otel-demo
      initContainers:
        - name: wait-for-kafka
          image: busybox:latest
          command: ["sh", "-c", "until nc -z -v -w30 kafka 9092; do echo waiting for kafka; sleep 2; done;"]
      containers:
        - name: accounting
          image: {{ .Values.registry }}/accounting:{{ .Values.imageTag }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - name: OTEL_SERVICE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app.kubernetes.io/component']
            - name: OTEL_COLLECTOR_NAME
              value: {{ .Values.otelCollectorName }}
            - name: KAFKA_SERVICE_ADDR
              value: "kafka:9092"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://$(OTEL_COLLECTOR_NAME):4318"
            - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
              value: cumulative
          resources:
            limits:
              memory: 120Mi
---
